<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none" class="brand-logo-svg">
  <defs>
    <linearGradient id="fmGradPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0EA5E9" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="fmGradAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <filter id="fmGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#2563EB" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Icon Mark -->
  <g transform="translate(6, 6)" filter="url(#fmGlow)">
    <!-- Base Shield / Hexagon -->
    <rect x="2" y="2" width="48" height="48" rx="14" fill="url(#fmGradPrimary)" />
    
    <!-- Dynamic Growth Elements & M/F Structure -->
    <!-- Growth Bars -->
    <rect x="13" y="28" width="5" height="12" rx="2.5" fill="#FFFFFF" fill-opacity="0.85" />
    <rect x="22" y="20" width="5" height="20" rx="2.5" fill="#FFFFFF" fill-opacity="0.95" />
    <rect x="31" y="14" width="5" height="26" rx="2.5" fill="url(#fmGradAccent)" />
    
    <!-- Growth Trendline & Node -->
    <path d="M15.5 27 L24.5 19 L33.5 13" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="33.5" cy="13" r="3.5" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.5" />
    
    <!-- Inner Accent Sparkle -->
    <circle cx="39" cy="36" r="2" fill="#38BDF8" fill-opacity="0.9" />
  </g>
  
  <!-- Typography -->
  <g transform="translate(66, 17)">
    <text x="0" y="21" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="21" font-weight="800" fill="#0B132B" letter-spacing="-0.5px">
      FinanceMaster <tspan fill="#2563EB">Pro</tspan>
    </text>
    <text x="1" y="36" font-family="'Inter', -apple-system, sans-serif" font-size="9.5" font-weight="600" fill="#64748B" letter-spacing="1.8px" text-transform="uppercase">
      Smart SaaS for Finance
    </text>
  </g>
</svg>

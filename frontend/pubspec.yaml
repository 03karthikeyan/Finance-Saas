name: finance_saas_frontend
description: "Production Multi-Tenant Finance Management SaaS Application (Flutter Web & Mobile)"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_bloc: ^9.1.1
  bloc: ^9.0.1
  equatable: ^2.0.7

  # Networking & HTTP
  dio: ^5.8.0+1

  # Routing
  go_router: ^14.8.1

  # Secure Storage & Cache
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3

  # Formatting & Localization
  intl: ^0.20.2

  # Charts & Visualizations
  fl_chart: ^1.1.1

  # Fonts
  google_fonts: ^6.3.3

  # Push Notifications & Firebase
  firebase_core: ^3.12.1
  firebase_messaging: ^15.2.4
  flutter_local_notifications: ^18.0.1

  # Utilities
  url_launcher: ^6.3.1
  uuid: ^4.5.1
  pdf: ^3.13.0
  printing: ^5.15.0
  path_provider: ^2.1.6
  shimmer: ^3.0.0
  image_picker: ^1.2.3

  # Maps & Location (Route Map for Agents)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/FMP_icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/FMP_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/
